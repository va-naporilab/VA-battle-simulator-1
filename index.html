<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘挙動シミュレータ</title>

<style>
body{font-family:system-ui;background:#eef2f6}
.panel{background:#fff;padding:12px;border-radius:8px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.flex{display:flex;gap:20px;flex-wrap:wrap}
.army{width:360px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:2px solid #999;border-radius:6px;padding:4px;font-size:12px}
.ally{border-color:#2b6cb0;background:#e8f2ff}
.enemy{border-color:#c53030;background:#ffecec}
.dead{background:#ccc;color:#777}
.hpbar{height:6px;background:#ddd;border-radius:4px;overflow:hidden;margin:2px 0}
.hpfill{height:100%}
.controls button{margin:4px}
.log{height:200px;overflow:auto;background:#111;color:#0f0;font-size:11px;padding:6px}
canvas{background:#fafafa;border:1px solid #ccc;border-radius:6px}
</style>
</head>
<body>

<h2>戦闘シミュレータ（検証用）</h2>

<div class="panel flex">
<div>
<b>自軍</b><br>
出撃 <input id="allyCount" type="number" value="200"><br>
火力 <input id="allyAtk" type="number" value="100"><br>
耐久 <input id="allyHp" type="number" value="160"><br>
鉄壁% <input id="allyWall" type="number" value="40"><br>
鉄壁R <input id="allyWallRound" type="number" value="2">
</div>
<div>
<b>敵軍</b><br>
出撃 <input id="enemyCount" type="number" value="200"><br>
火力 <input id="enemyAtk" type="number" value="100"><br>
耐久 <input id="enemyHp" type="number" value="160"><br>
鉄壁% <input id="enemyWall" type="number" value="40"><br>
鉄壁R <input id="enemyWallRound" type="number" value="2">
</div>
<div>
<b>侵攻側</b><br>
<select id="attacker">
<option value="ally">自軍</option>
<option value="enemy">敵軍</option>
</select><br><br>
<button onclick="startSim()">開始</button>
</div>
</div>

<div class="flex">
<div class="army panel"><h3>自軍</h3><div id="allyGrid" class="grid"></div></div>
<div class="army panel"><h3>敵軍</h3><div id="enemyGrid" class="grid"></div></div>
</div>

<div class="panel controls">
ターン <span id="turn">1</span> /
ラウンド <span id="round">1</span><br>
<button onclick="nextTurn()">次のターン</button>
<button onclick="toggleAuto()">▶/■ 自動進行</button>
１ターンの時間間隔 <input id="speed" type="range" min="0.2" max="2" step="0.2" value="0.5"> <span id="speedVal">1.0</span>s
</div>

<div class="panel">
<h3>HP推移グラフ</h3>
<canvas id="chart" width="600" height="200"></canvas>
</div>

<div class="panel">
<h3>戦闘ログ</h3>
<div id="log" class="log"></div>
<button onclick="exportCSV()">CSV出力</button>
<button onclick="exportJSON()">JSON出力</button>
</div>

<script>
let ally=[],enemy=[],turn=1,round=1,order=[],auto=null;
let logs=[],history=[];

const ctx=document.getElementById("chart").getContext("2d");

function makeSlots(cnt,hp){
 let s=[...Array(9)].map(()=>({u:0,h:0,max:0}));
 let i=0;while(cnt>0){s[i++%9].u++;cnt--;}
 s.forEach(x=>{x.h=x.u*hp;x.max=x.h});
 return s;
}

function render(){
 const draw=(slots,id,cls)=>{
  const g=document.getElementById(id);g.innerHTML="";
  slots.forEach((s,i)=>{
   const d=document.createElement("div");
   d.className="slot "+cls+(s.u===0?" dead":"");
   const p=Math.max(0,s.h)/s.max*100;
   d.innerHTML=`Slot${i+1} 台数:${s.u} HP:${Math.round(s.h)}
   <div class="hpbar"><div class="hpfill" style="width:${p}%;background:${cls==="ally"?"#2b6cb0":"#c53030"}"></div></div>`;
   g.appendChild(d);
  });
 };
 draw(ally,"allyGrid","ally");
 draw(enemy,"enemyGrid","enemy");
 turnSpan.textContent=turn;
 roundSpan.textContent=round;
 drawChart();
}

function startSim(){
 ally=makeSlots(+allyCount.value,+allyHp.value);
 enemy=makeSlots(+enemyCount.value,+enemyHp.value);
 turn=1;round=1;logs=[];history=[];
 order=[];
 let a=attacker.value;
 for(let i=0;i<9;i++){order.push({s:a,i});order.push({s:a==="ally"?"enemy":"ally",i});}
 render();logBox.innerHTML="";
}

function step(){
 let o=order[(turn-1)%order.length];
 let atk=o.s==="ally"?ally:enemy;
 let def=o.s==="ally"?enemy:ally;
 if(atk[o.i].u>0){
  let fire=atk[o.i].u*(o.s==="ally"?+allyAtk.value:+enemyAtk.value);
  let tgt=def.filter(x=>x.u>0);
  if(tgt.length){
   let d=fire/tgt.length;
   // ===== 鉄壁処理（修正点）=====
   let wall = o.s === "ally" ? +enemyWall.value : +allyWall.value;
   let wallRound = o.s === "ally" ? +enemyWallRound.value : +allyWallRound.value;

   if (round <= wallRound && wall > 0) {
    d *= (1 - wall / 100);
   }
   // =============================
   tgt.forEach(s=>{
    s.h-=d;
    while(s.h<=(s.u-1)*(o.s==="ally"?+enemyHp.value:+allyHp.value))s.u--;
    if(s.u<=0){s.u=0;s.h=0;}
   });
   logs.push(`T${turn} ${o.s} Slot${o.i+1} dmg:${d.toFixed(2)}`);
  }
 }
 history.push({turn,ally:sum(ally),enemy:sum(enemy)});
 turn++;
 if((turn-1)%order.length===0)round++;
 render();updateLog();
}

function nextTurn(){if(!ended())step();}
function toggleAuto(){
 if(auto){clearInterval(auto);auto=null;return;}
 auto=setInterval(()=>{if(ended())toggleAuto();else step();},+speed.value*1000);
}

function ended(){
 return !ally.some(s=>s.u>0)||!enemy.some(s=>s.u>0);
}

function sum(slots){return slots.reduce((a,s)=>a+s.h,0);}

function updateLog(){
 logBox.innerHTML=logs.slice(-40).join("<br>");
 logBox.scrollTop=logBox.scrollHeight;
}

function drawChart(){
 ctx.clearRect(0,0,600,200);
 if(history.length<2)return;
 let max=Math.max(...history.map(h=>Math.max(h.ally,h.enemy)));
 history.forEach((h,i)=>{
  let x=i*600/history.length;
  ctx.fillStyle="blue";
  ctx.fillRect(x,200-h.ally/max*200,2,2);
  ctx.fillStyle="red";
  ctx.fillRect(x,200-h.enemy/max*200,2,2);
 });
}

function exportCSV(){
 let rows=["turn,allyHP,enemyHP"];
 history.forEach(h=>rows.push(`${h.turn},${h.ally},${h.enemy}`));
 download(rows.join("\n"),"log.csv");
}

function exportJSON(){
 download(JSON.stringify({settings:getSettings(),logs,history},null,2),"log.json");
}

function getSettings(){
 return {allyCount:allyCount.value,enemyCount:enemyCount.value};
}

function download(text,name){
 let a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([text]));
 a.download=name;a.click();
}

const turnSpan=document.getElementById("turn");
const roundSpan=document.getElementById("round");
const logBox=document.getElementById("log");
speed.oninput=()=>speedVal.textContent=speed.value;
</script>
</body>
</html>
